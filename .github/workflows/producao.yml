
name: Universo Oculto - Producao

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  criar-roteiro:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Preparar ambiente
        uses: actions/checkout@v4

      - name: Gerar roteiro com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          PROMPT='Crie um roteiro original para o canal Universo Oculto sobre 7 curiosidades surpreendentes e verdadeiras sobre o planeta Terra. Escreva em português brasileiro, com abertura impactante, sete partes educativas e encerramento. Não invente fatos.'

          REQUEST=$(jq -n \
            --arg prompt "$PROMPT" \
            '{contents:[{parts:[{text:$prompt}]}],generationConfig:{temperature:0.7,maxOutputTokens:4000}}')

          URL="https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"

          for attempt in 1 2 3 4 5; do
            echo "Tentativa $attempt de 5"

            CODE=$(curl -sS \
              --connect-timeout 20 \
              --max-time 180 \
              -o resposta.json \
              -w "%{http_code}" \
              -X POST "$URL" \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$REQUEST") || CODE=000

            if [ "$CODE" = "200" ]; then
              break
            fi

            echo "Resposta HTTP: $CODE"

            if [ "$CODE" = "400" ] || [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
              cat resposta.json
              exit 1
            fi

            if [ "$attempt" = "5" ]; then
              cat resposta.json
              exit 1
            fi

            sleep $((attempt * 15))
          done

          ROTEIRO=$(jq -r '.candidates[0].content.parts | map(select(.text != null) | .text) | join("\n")' resposta.json)

          if [ -z "$ROTEIRO" ] || [ "$ROTEIRO" = "null" ]; then
            echo "Gemini nao retornou texto."
            cat resposta.json
            exit 1
          fi

          printf '%s\n' "$ROTEIRO" > roteiro.md
          echo "Roteiro criado com sucesso!"

      - name: Salvar roteiro
        uses: actions/upload-artifact@v4
        with:
          name: roteiro-universo-oculto
          path: roteiro.md
